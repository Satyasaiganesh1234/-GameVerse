<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <title>Explore Games — GameVerse</title>
</head>
<body data-page="explore">

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-brand"><span class="brand-icon">🎮</span><span>GameVerse</span><span id="data-source-badge" class="data-badge"></span></a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
      <div class="nav-menu" id="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="explore.html" class="nav-link">Explore</a>
        <a href="compare.html" class="nav-link">Compare <span class="compare-count">0</span></a>
        <a href="favorites.html" class="nav-link">Favorites</a>
        <a href="mongodb.html" class="nav-link">DB Shell</a>
        <a href="about.html" class="nav-link">About</a>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <section class="section">
      <div class="container">
        <h1 class="section-title neon-text">🔍 Explore Games</h1>

        <div class="filter-bar">
          <div class="filter-row">
            <div class="filter-group" style="flex: 2;">
              <label for="explore-search">Search</label>
              <input type="text" id="explore-search" placeholder="Search games, genres, tags...">
            </div>
            <div class="filter-group">
              <label for="genre-filter">Genre</label>
              <select id="genre-filter"><option value="">All Genres</option></select>
            </div>
            <div class="filter-group">
              <label for="platform-filter">Platform</label>
              <select id="platform-filter"><option value="">All Platforms</option></select>
            </div>
            <div class="filter-group">
              <label for="rating-filter">Min Rating</label>
              <select id="rating-filter">
                <option value="">Any Rating</option>
                <option value="9.5">9.5+</option>
                <option value="9.0">9.0+</option>
                <option value="8.5">8.5+</option>
                <option value="8.0">8.0+</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="sort-select">Sort By</label>
              <select id="sort-select">
                <option value="popularity-desc">Most Popular</option>
                <option value="rating-desc">Highest Rated</option>
                <option value="rating-asc">Lowest Rated</option>
                <option value="title-asc">Title A–Z</option>
                <option value="title-desc">Title Z–A</option>
                <option value="year-desc">Newest First</option>
                <option value="year-asc">Oldest First</option>
                <option value="players-desc">Most Players</option>
              </select>
            </div>
          </div>
          <div class="filter-row" style="margin-top: 1rem; justify-content: space-between;">
            <div class="filter-actions">
              <button class="btn btn-sm btn-secondary" id="clear-filters">✕ Clear Filters</button>
              <button class="view-toggle-btn active" data-view="grid" title="Grid View">▦</button>
              <button class="view-toggle-btn" data-view="list" title="List View">☰</button>
            </div>
            <span class="result-count" id="result-count"></span>
          </div>
        </div>

        <div class="game-grid" id="explore-grid">
          <div class="loading-spinner"><div class="spinner"></div><p>Loading games...</p></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-brand">🎮 GameVerse</div>
      <p class="footer-text">Digital Gaming &amp; Exploration Platform — Academic Project</p>
      <p class="footer-text">Software Engineering &amp; System Design · 2026</p>
    </div>
  </footer>
  <button id="scroll-top-btn" aria-label="Scroll to top">↑</button>

  <script src="js/catalog-data.js"></script>
  <script src="js/db-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
