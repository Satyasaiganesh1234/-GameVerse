<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Details — GameVerse</title>
  <script>
    (function() {
      const SLUGS = {
        1: 'gta-vi',
        2: 'uncharted-lost-legacy',
        3: 'cyberpunk-2077',
        4: 'rdr2',
        5: 'black-myth-wukong',
        6: 'god-of-war',
        7: '007-first-light',
        8: 'ghost-of-tsushima',
        9: 'ac-shadows',
        10: 'forza-horizon-6',
        11: 'spider-man-remastered',
        12: 'last-of-us',
        13: 'nfs-most-wanted',
        14: 'gta-vice-city',
        15: 'ac-mirage',
        16: 'resident-evil-requiem',
        17: 'cs2',
        18: 'project-igi',
        19: 'minecraft',
        20: 'tekken-3'
      };
      const params = new URLSearchParams(window.location.search);
      const rawId = params.get('id') || params.get('game');
      if (rawId) {
        const idNum = parseInt(rawId, 10);
        let slug = null;
        if (!isNaN(idNum) && SLUGS[idNum]) {
          slug = SLUGS[idNum];
        } else if (typeof rawId === 'string') {
          const matchEntry = Object.entries(SLUGS).find(([k, v]) => v.toLowerCase() === rawId.toLowerCase());
          if (matchEntry) slug = matchEntry[1];
        }
        if (slug) {
          window.location.replace('games/' + slug + '.html');
          return;
        }
      }
      // If no valid id found, redirect to explore or home
      window.location.replace('index.html');
    })();
  </script>
</head>
<body style="background:#070913; color:#f1f5f9; font-family:sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh;">
  <p>Redirecting to dedicated game page... <a href="index.html" style="color:#00f2fe;">Click here if not redirected</a>.</p>
</body>
</html>
